name: HEUR_DISK_IMAGE_MOUNTING_VIA_HDIUTIL_-_MACOS
points: 1
onDuplicate: ignore
tags:
- attack.initial-access
- attack.collection
- attack.t1566.001
- attack.t1560.001
match:
- event:
    name: EXEC
    threshold:
      total:
        amount: 1
    restrict:
      allOf:
      - path+ends: /hdiutil
      - anyOf:
        - commandLine+contains: 'attach '
        - commandLine+contains: 'mount '
    _original_: |
      title: Disk Image Mounting Via Hdiutil - MacOS
      id: bf241472-f014-4f01-a869-96f99330ca8c
      status: experimental
      description: Detects the execution of the hdiutil utility in order to mount disk images.
      references:
          - https://www.loobins.io/binaries/hdiutil/
          - https://www.sentinelone.com/blog/from-the-front-linesunsigned-macos-orat-malware-gambles-for-the-win/
          - https://ss64.com/mac/hdiutil.html
      author: Omar Khaled (@beacon_exe)
      date: 2024-08-10
      tags:
          - attack.initial-access
          - attack.collection
          - attack.t1566.001
          - attack.t1560.001
      logsource:
          product: macos
          category: process_creation
      detection:
          selection:
              Image|endswith: /hdiutil
              CommandLine|contains:
                  - 'attach '
                  - 'mount '
          condition: selection
      falsepositives:
          - Legitimate usage of hdiutil by administrators and users.
      level: medium
