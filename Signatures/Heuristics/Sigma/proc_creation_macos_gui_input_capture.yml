name: HEUR_GUI_INPUT_CAPTURE_-_MACOS
points: 1
onDuplicate: ignore
tags:
- attack.credential-access
- attack.t1056.002
match:
- event:
    name: EXEC
    threshold:
      total:
        amount: 1
    restrict:
      allOf:
      - allOf:
        - path+equals: /usr/sbin/osascript
      - allOf:
        - allOf:
          - commandLine+contains: -e
          - commandLine+contains: display
          - commandLine+contains: dialog
          - commandLine+contains: answer
      - allOf:
        - anyOf:
          - commandLine+contains: admin
          - commandLine+contains: administrator
          - commandLine+contains: authenticate
          - commandLine+contains: authentication
          - commandLine+contains: credentials
          - commandLine+contains: pass
          - commandLine+contains: password
          - commandLine+contains: unlock
    _original_: |
      title: GUI Input Capture - macOS
      id: 60f1ce20-484e-41bd-85f4-ac4afec2c541
      status: test
      description: Detects attempts to use system dialog prompts to capture user credentials
      references:
          - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.002/T1056.002.md
          - https://scriptingosx.com/2018/08/user-interaction-from-bash-scripts/
      author: remotephone, oscd.community
      date: 2020-10-13
      modified: 2022-12-25
      tags:
          - attack.credential-access
          - attack.t1056.002
      logsource:
          product: macos
          category: process_creation
      detection:
          selection1:
              Image: '/usr/sbin/osascript'
          selection2:
              CommandLine|contains|all:
                  - '-e'
                  - 'display'
                  - 'dialog'
                  - 'answer'
          selection3:
              CommandLine|contains:
                  - 'admin'
                  - 'administrator'
                  - 'authenticate'
                  - 'authentication'
                  - 'credentials'
                  - 'pass'
                  - 'password'
                  - 'unlock'
          condition: all of selection*
      falsepositives:
          - Legitimate administration tools and activities
      level: low
