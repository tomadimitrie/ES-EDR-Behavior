name: HEUR_CREDENTIALS_FROM_PASSWORD_STORES_-_KEYCHAIN
points: 1
onDuplicate: ignore
tags:
- attack.credential-access
- attack.t1555.001
match:
- event:
    name: EXEC
    threshold:
      total:
        amount: 1
    restrict:
      anyOf:
      - allOf:
        - path+equals: /usr/bin/security
        - anyOf:
          - commandLine+contains: find-certificate
          - commandLine+contains: ' export '
      - allOf:
        - anyOf:
          - commandLine+contains: ' dump-keychain '
          - commandLine+contains: ' login-keychain '
    _original_: |
      title: Credentials from Password Stores - Keychain
      id: b120b587-a4c2-4b94-875d-99c9807d6955
      status: test
      description: Detects passwords dumps from Keychain
      references:
          - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.001/T1555.001.md
          - https://gist.github.com/Capybara/6228955
      author: Tim Ismilyaev, oscd.community, Florian Roth (Nextron Systems)
      date: 2020-10-19
      modified: 2021-11-27
      tags:
          - attack.credential-access
          - attack.t1555.001
      logsource:
          category: process_creation
          product: macos
      detection:
          selection1:
              Image: '/usr/bin/security'
              CommandLine|contains:
                  - 'find-certificate'
                  - ' export '
          selection2:
              CommandLine|contains:
                  - ' dump-keychain '
                  - ' login-keychain '
          condition: 1 of selection*
      falsepositives:
          - Legitimate administration activities
      level: medium
