name: HEUR_DISABLE_SECURITY_TOOLS
points: 1
onDuplicate: ignore
tags:
- attack.defense-evasion
- attack.t1562.001
match:
- event:
    name: EXEC
    threshold:
      total:
        amount: 1
    restrict:
      anyOf:
      - allOf:
        - allOf:
          - path+equals: /bin/launchctl
          - commandLine+contains: unload
        - allOf:
          - anyOf:
            - commandLine+contains: com.objective-see.lulu.plist
            - commandLine+contains: com.objective-see.blockblock.plist
            - commandLine+contains: com.google.santad.plist
            - commandLine+contains: com.carbonblack.defense.daemon.plist
            - commandLine+contains: com.carbonblack.daemon.plist
            - commandLine+contains: at.obdev.littlesnitchd.plist
            - commandLine+contains: com.tenablesecurity.nessusagent.plist
            - commandLine+contains: 
                com.opendns.osx.RoamingClientConfigUpdater.plist
            - commandLine+contains: com.crowdstrike.falcond.plist
            - commandLine+contains: com.crowdstrike.userdaemon.plist
            - commandLine+contains: osquery
            - commandLine+contains: filebeat
            - commandLine+contains: auditbeat
            - commandLine+contains: packetbeat
            - commandLine+contains: td-agent
      - allOf:
        - path+equals: /usr/sbin/spctl
        - commandLine+contains: disable
    _original_: |
      title: Disable Security Tools
      id: ff39f1a6-84ac-476f-a1af-37fcdf53d7c0
      status: test
      description: Detects disabling security tools
      references:
          - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
      author: Daniil Yugoslavskiy, oscd.community
      date: 2020-10-19
      modified: 2021-11-27
      tags:
          - attack.defense-evasion
          - attack.t1562.001
      logsource:
          category: process_creation
          product: macos
      detection:
          launchctl_unload:
              Image: '/bin/launchctl'
              CommandLine|contains: 'unload'
          security_plists:
              CommandLine|contains:
                  - 'com.objective-see.lulu.plist'                     # Objective-See firewall management utility
                  - 'com.objective-see.blockblock.plist'               # Objective-See persistence locations watcher/blocker
                  - 'com.google.santad.plist'                          # google santa
                  - 'com.carbonblack.defense.daemon.plist'             # carbon black
                  - 'com.carbonblack.daemon.plist'                     # carbon black
                  - 'at.obdev.littlesnitchd.plist'                     # Objective Development Software firewall management utility
                  - 'com.tenablesecurity.nessusagent.plist'            # Tenable Nessus
                  - 'com.opendns.osx.RoamingClientConfigUpdater.plist' # OpenDNS Umbrella
                  - 'com.crowdstrike.falcond.plist'                    # Crowdstrike Falcon
                  - 'com.crowdstrike.userdaemon.plist'                 # Crowdstrike Falcon
                  - 'osquery'                                          # facebook osquery
                  - 'filebeat'                                         # elastic log file shipper
                  - 'auditbeat'                                        # elastic auditing agent/log shipper
                  - 'packetbeat'                                       # elastic network logger/shipper
                  - 'td-agent'                                         # fluentd log shipper
          disable_gatekeeper:
              Image: '/usr/sbin/spctl'
              CommandLine|contains: 'disable'
          condition: (launchctl_unload and security_plists) or disable_gatekeeper
      falsepositives:
          - Legitimate activities
      level: medium
