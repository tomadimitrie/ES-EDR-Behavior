name: HEUR_SECURITY_SOFTWARE_DISCOVERY_-_MACOS
points: 1
onDuplicate: ignore
tags:
- attack.discovery
- attack.t1518.001
match:
- event:
    name: EXEC
    threshold:
      total:
        amount: 1
    restrict:
      allOf:
      - allOf:
        - path+equals: /usr/bin/grep
      - anyOf:
        - allOf:
          - anyOf:
            - commandLine+contains: nessusd
            - commandLine+contains: santad
            - commandLine+contains: CbDefense
            - commandLine+contains: falcond
            - commandLine+contains: td-agent
            - commandLine+contains: packetbeat
            - commandLine+contains: filebeat
            - commandLine+contains: auditbeat
            - commandLine+contains: osqueryd
            - commandLine+contains: BlockBlock
            - commandLine+contains: LuLu
        - allOf:
          - allOf:
            - commandLine+contains: Little
            - commandLine+contains: Snitch
    _original_: |
      title: Security Software Discovery - MacOs
      id: 0ed75b9c-c73b-424d-9e7d-496cd565fbe0
      status: test
      description: Detects usage of system utilities (only grep for now) to discover security software discovery
      references:
          - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md
      author: Daniil Yugoslavskiy, oscd.community
      date: 2020-10-19
      modified: 2022-11-27
      tags:
          - attack.discovery
          - attack.t1518.001
      logsource:
          category: process_creation
          product: macos
      detection:
          image:
              Image: '/usr/bin/grep'
          selection_cli_1:
              CommandLine|contains:
                  - 'nessusd'        # nessus vulnerability scanner
                  - 'santad'         # google santa
                  - 'CbDefense'      # carbon black
                  - 'falcond'        # crowdstrike falcon
                  - 'td-agent'       # fluentd log shipper
                  - 'packetbeat'     # elastic network logger/shipper
                  - 'filebeat'       # elastic log file shipper
                  - 'auditbeat'      # elastic auditing agent/log shipper
                  - 'osqueryd'       # facebook osquery
                  - 'BlockBlock'     # Objective-See persistence locations watcher/blocker
                  - 'LuLu'           # Objective-See firewall management utility
          selection_cli_2: # Objective Development Software firewall management utility
              CommandLine|contains|all:
                  - 'Little'
                  - 'Snitch'
          condition: image and 1 of selection_cli_*
      falsepositives:
          - Legitimate activities
      level: medium
