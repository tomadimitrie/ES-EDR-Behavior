name: HEUR_BUNDLE_VERSION
points: 1
onDuplicate: ignore
tags: []
match:
- event:
    name: EXEC
    restrict:
      allOf:
        - path+ends: "/PlistBuddy"
        - anyOf:
            - commandLine+contains: "CFBundleShortVersionString"
            - commandLine+contains: "CFBundleVersion"
    threshold:
      total:
        amount: 1
