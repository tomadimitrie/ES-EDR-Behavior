name: HEUR_DATE_CHANGE
points: 1
onDuplicate: ignore
tags: []
match:
- event:
    name: EXEC
    restrict:
      anyOf:
        - allOf:
            - path+ends: "/date"
            - commandLine+regex: "(\\d+)"
        - allOf:
            - path+ends: "/SetFile"
            - args+contains: "-m"
    threshold:
      total:
        amount: 1
