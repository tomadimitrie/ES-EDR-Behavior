name: HEUR_HIDDEN_FILE_DISCOVERY
points: 1
onDuplicate: ignore
tags: []
match:
- event:
    name: EXEC
    restrict:
      anyOf:
        - allOf:
            - path+ends: "/xattr"
            - args+contains: "-lr"
        - allOf:
            - path+ends: "/chflags"
            - args+contains: "hidden"
        - allOf:
            - path+ends: "/defaults"
            - args+contains: "AppleShowAllFiles"
    threshold:
      total:
        amount: 1
